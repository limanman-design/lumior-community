name: Feature request / 功能建议
description: Explain the workflow and problem before proposing an implementation.
body:
  - type: textarea
    id: workflow
    attributes:
      label: What are you trying to do? / 想完成什么
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Where does the current workflow fall short? / 当前遇到的困难
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope and alternatives / 建议范围与替代办法
