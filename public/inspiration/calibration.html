<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First Calibration</title>

<style>
body{margin:0;background:#050506;color-scheme:dark;--calibration-accent:#B3DE3E}
.calibration-layout button:focus-visible,.calibration-layout canvas:focus-visible{outline:2px solid var(--calibration-accent);outline-offset:3px}
.calibration-layout button:disabled{opacity:.35;cursor:default!important}
.calibration-primary:hover:not(:disabled){background:#e8e8e8!important;border-color:#e8e8e8!important}
.calibration-toast-check{color:var(--calibration-accent)}
.rowbtn{transition:background .25s ease,border-color .25s ease}
.rowbtn:hover{border-color:rgba(236,236,232,0.3)}
.toast{animation:toastIn .35s ease both}
@keyframes toastIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
<style>
html,body{margin:0;height:100%;background:#050506;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1440px;height:900px;transform-origin:0 0}
</style>
<style>
#stage{position:relative;left:0;top:0;width:100%;height:100%;transform:none}
.calibration-layout{width:100%!important;height:100%!important}
.calibration-layout>canvas{transform:scale(var(--visual-scale));transform-origin:0 0;left:var(--visual-left)!important;top:var(--visual-top)!important}
.calibration-panel{left:auto!important;right:12px;top:12px!important;width:calc(var(--panel-width) - 12px)!important;height:calc(100% - 24px)!important;overflow:auto;scrollbar-width:thin;scrollbar-color:#414143 transparent;scrollbar-gutter:stable}
.calibration-panel,.calibration-panel *{box-sizing:border-box}
.calibration-panel>div{flex-shrink:0}
.calibration-panel>div:last-child{flex:1 0 auto!important}
.calibration-panel button{flex-shrink:0}
.calibration-panel .research-label{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.calibration-layout>span{left:64px!important;top:18px!important;font-size:13px!important}
.calibration-layout>button{left:24px!important;top:auto!important;bottom:16px}
.calibration-layout>[role=dialog]{left:20px!important;top:70px!important;width:min(560px,calc(100% - 40px))!important;max-height:calc(100% - 90px);overflow:auto;z-index:5}
@media(max-width:759px){
.calibration-layout{overflow:auto!important}
.calibration-panel{top:var(--visual-height)!important;right:12px;width:calc(100% - 24px)!important;height:auto!important;overflow:visible;padding-bottom:24px}
.calibration-layout>button{top:12px!important;bottom:auto;left:auto!important;right:20px}
}
</style>
<style>
.calibration-panel>div:first-child>div:first-child{flex-wrap:wrap}
.calibration-panel>div:first-child>div:first-child>span{white-space:nowrap}
.calibration-panel>div:first-child>div:first-child>.research-label{flex:1;max-width:none}
.calibration-panel>div:first-child>div:last-child>button{padding:0 6px!important;gap:4px!important}
.calibration-panel>div:last-child>div[style*="gap: 16px"]{flex-wrap:wrap;gap:8px 16px!important}
.calibration-panel>div:last-child>div[style*="gap: 16px"]>span{white-space:nowrap}
</style></head>
<body>
<div id="stage"></div>

<!-- ============================================================
  UI 模板（原 Claude Design 画板的标记）
  {{expr}} 取 renderVals() 返回的值；<sc-if value> 条件渲染；<sc-for list as> 循环渲染
============================================================ -->
<template id="tuner-template">
<div class="calibration-layout" style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #050506; color: #ecece8; font-family: 'Geist', 'Noto Sans SC', sans-serif;">
<canvas ref="{{cvRef}}" width="{{cw}}" height="{{ch}}" tabIndex="0" aria-label="{{canvasLabel}}" onPointerDown="{{pDown}}" onPointerMove="{{pMove}}" onPointerUp="{{pUp}}" onPointerCancel="{{pUp}}" onWheel="{{wheel}}" onKeyDown="{{keyDown}}" style="position: absolute; left: 0; top: 0; width: 1440px; height: 900px; touch-action: none;"></canvas>

<span style="position: absolute; left: 48px; top: 40px; font-family: 'Noto Sans SC', 'Geist', sans-serif; font-weight: 400; font-size: 17px; letter-spacing: 0.2em;">{{tx.brand}}</span>


<sc-if value="{{hasDetail}}" hint-placeholder-val="{{ false }}">
<div onClick="{{closeDetail}}" style="position: absolute; left: 0; top: 0; width: 890px; height: 900px; background: rgba(5,5,6,0.6);"></div>
<div role="dialog" aria-label="{{det.title}}" style="position: absolute; left: 160px; top: 220px; width: 560px; box-sizing: border-box; padding: 24px 26px; background: #0e0e0f; border: 1px solid #3a3a3c; border-radius: 14px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 24px 80px rgba(0,0,0,0.7);">
<div style="display: flex; justify-content: space-between; align-items: center;">
<span style="font-family: 'Geist Mono', 'Noto Sans SC', monospace; font-size: 11px; letter-spacing: 0.08em; color: #B3DE3E;">{{det.no}} · {{det.kind}}</span>
<button onClick="{{closeDetail}}" aria-label="{{closeLabel}}" style="width: 28px; height: 28px; border-radius: 14px; background: transparent; border: 1px solid #3a3a3c; color: #cfcfcb; font-size: 14px; cursor: pointer;">×</button>
</div>
<span style="font-family: 'Noto Sans SC', sans-serif; font-size: 22px; line-height: 1.4; color: #ecece8;">{{det.title}}</span>
<div style="display: flex; gap: 8px; align-items: center; font-family: 'Geist Mono', 'Noto Sans SC', monospace; font-size: 11px; color: #9a9c9e;">
<span>{{fromLabel}}</span><span style="padding: 3px 10px; border-radius: 10px; background: #1a1a1c; color: #cfcfcb;">{{det.from}}</span>
</div>
<p style="margin: 0; font-family: 'Noto Sans SC', sans-serif; font-size: 14px; line-height: 1.85; color: #cfcfcb;">{{det.desc}}</p>
<div style="display: flex; gap: 8px; padding-top: 4px;">
<button class="calibration-primary" onClick="{{det.take}}" style="height: 36px; padding: 0 18px; border-radius: 18px; background: #ffffff; border: 1px solid #ffffff; color: #161616; font-family: 'Noto Sans SC', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer;">{{det.btn}}</button>
<button onClick="{{closeDetail}}" style="height: 36px; padding: 0 18px; border-radius: 18px; background: transparent; border: 1px solid rgba(236,236,232,0.3); color: #ecece8; font-family: 'Noto Sans SC', sans-serif; font-size: 13px; cursor: pointer;">{{closeLabel}}</button>
</div>
</div>
</sc-if>

<div class="calibration-panel" style="position: absolute; left: 904px; top: 24px; width: 512px; height: 852px; display: flex; flex-direction: column; gap: 12px;">
<div style="padding: 14px 16px; background: #0a0a0b; border: 1px solid #1c1c1e; border-radius: 14px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; align-items: center; gap: 10px;">
<span style="font-family: 'Geist Mono', 'Noto Sans SC', monospace; font-size: 10px; letter-spacing: 0.14em; color: #6d6f72;">{{tx.manual}}</span>
<span style="flex-grow: 1;"></span>
<span style="font-family: 'Geist Mono', 'Noto Sans SC', monospace; font-size: 10px; color: #6d6f72;">{{tx.yourDir}}</span>
<span class="research-label" style="font-family: 'Noto Sans SC', sans-serif; font-size: 12px; color: #9a9c9e;">{{primaryLabel}} ★</span>
<button onClick="{{toggleDir}}" aria-expanded="{{editDir}}" style="height: 22px; padding: 0 9px; border-radius: 11px; background: transparent; border: 1px solid #2e2e31; color: #9a9c9e; font-family: 'Noto Sans SC', sans-serif; font-size: 11px; cursor: pointer;">{{dirBtn}}</button>
</div>
<sc-if value="{{editDir}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; gap: 6px;">
<sc-for list="{{dirs}}" as="d" hint-placeholder-count="4">
<button onClick="{{d.pick}}" aria-pressed="{{d.on}}" style="height: 26px; padding: 0 11px; border-radius: 13px; background: {{d.bg}}; border: 1px solid {{d.bd}}; color: {{d.fg}}; font-family: 'Noto Sans SC', sans-serif; font-size: 12px; cursor: pointer;">{{d.label}}</button>
</sc-for>
</div>
</sc-if>
<div style="display: flex; gap: 6px;">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
<button onClick="{{s.go}}" aria-current="{{s.cur}}" style="flex: 1 1 0; min-width: 0; height: 34px; padding: 0 10px; display: flex; align-items: center; gap: 7px; background: {{s.bg}}; border: 1px solid {{s.bd}}; border-radius: 8px; font-family: inherit; cursor: pointer;">
<span style="font-family: 'Geist Mono', monospace; font-size: 10px; color: {{s.nc}};">{{s.no}}</span>
<span style="font-family: 'Noto Sans SC', sans-serif; font-size: 12px; color: {{s.tc}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{s.title}}</span>
<span style="flex-grow: 1;"></span>
<span style="font-family: 'Geist Mono', monospace; font-size: 10px; color: {{s.stc}};">{{s.mark}}</span>
</button>
</sc-for>
</div>
</div>

<div style="flex: 1 1 0; min-height: 0; padding: 22px 24px; background: #111113; border: 1px solid #2c2c2f; border-radius: 16px; display: flex; flex-direction: column; gap: 16px; box-shadow: inset 0 1px 0 rgba(236,236,232,0.12);">
<div style="display: flex; flex-direction: column; gap: 8px;">
<div style="display: flex; justify-content: space-between; align-items: center;">
<span style="font-family: 'Geist Mono', 'Noto Sans SC', monospace; font-size: 11px; letter-spacing: 0.12em; color: #B3DE3E;">{{stepNo}} / 03 · {{tx.now}}</span>
<span style="font-family: 'Geist Mono', 'Noto Sans SC', monospace; font-size: 11px; color: #9a9c9e;">{{resMeta}}</span>
</div>
<span style="font-family: 'Noto Sans SC', sans-serif; font-size: 26px; font-weight: 400; line-height: 1.3; color: #ecece8;">{{tx.act}}</span>
<span style="font-family: 'Noto Sans SC', sans-serif; font-size: 13px; line-height: 1.6; color: #9a9c9e;">{{tx.actHint}}</span>
</div>

<sc-if value="{{rA}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; border: 1px solid #232325; border-radius: 10px;">
<sc-for list="{{selRows}}" as="d" hint-placeholder-count="3">
<div style="height: 50px; box-sizing: border-box; padding: 0 12px 0 16px; display: flex; align-items: center; gap: 10px; border-top: 1px solid {{d.line}};">
<sc-if value="{{d.filled}}" hint-placeholder-val="{{ true }}">
<span style="font-family: 'Noto Sans SC', sans-serif; font-size: 14px;">{{d.name}}</span>
<sc-if value="{{d.rec}}" hint-placeholder-val="{{ false }}"><span style="padding: 2px 8px; border-radius: 10px; border: 1px solid #B3DE3E; color: #B3DE3E; font-size: 10px;">{{tx.rec}}</span></sc-if>
<span style="flex-grow: 1;"></span>
<span style="padding: 3px 9px; border-radius: 10px; background: #1a1a1c; font-family: 'Geist Mono', 'Noto Sans SC', monospace; font-size: 10px; color: #9a9c9e;">{{d.dist}}</span>
<button onClick="{{d.remove}}" aria-label="{{removeScopeLabel}}" disabled="{{d.rec}}" style="width: 26px; height: 26px; border-radius: 13px; background: transparent; border: 1px solid {{d.xbd}}; color: {{d.xc}}; font-size: 12px; cursor: pointer;">×</button>
</sc-if>
<sc-if value="{{d.empty}}" hint-placeholder-val="{{ false }}">
<span style="font-family: 'Noto Sans SC', sans-serif; font-size: 12.5px; color: #5d5f62;">{{tx.addHint}}</span>
</sc-if>
</div>
</sc-for>
</div>
<div style="display: flex; gap: 16px; font-family: 'Geist Mono', 'Noto Sans SC', monospace; font-size: 10px; color: #7d7f82;">
<span>{{tx.near}}</span><span>{{tx.mid}}</span><span>{{tx.far}}</span><span style="color: #9a9c9e;">{{tx.farNote}}</span>
</div>
</sc-if>

<sc-if value="{{rC}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; border: 1px solid #232325; border-radius: 10px; overflow: hidden;">
<sc-for list="{{results}}" as="d" hint-placeholder-count="5">
<div style="padding: 12px 12px 12px 16px; display: flex; align-items: center; gap: 12px; border-top: 1px solid {{d.line}}; background: {{d.bg}};">
<span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: {{d.nc}};">{{d.no}}</span>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px;">
<span onClick="{{d.open}}" style="font-family: 'Noto Sans SC', sans-serif; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; text-decoration: underline; text-decoration-color: rgba(236,236,232,0.25); text-underline-offset: 4px;">{{d.title}}</span>
<span style="display: flex; gap: 6px;"><span style="padding: 2px 8px; border-radius: 10px; background: #1a1a1c; font-size: 10px; color: #9a9c9e;">{{d.domain}}</span><span style="padding: 2px 8px; border-radius: 10px; background: #1a1a1c; font-size: 10px; color: #9a9c9e;">{{d.kind}}</span></span>
</div>
<button onClick="{{d.take}}" style="height: 30px; padding: 0 12px; border-radius: 15px; background: {{d.btnBg}}; border: 1px solid {{d.btnBd}}; color: {{d.btnC}}; font-family: 'Noto Sans SC', sans-serif; font-size: 12px; cursor: pointer; white-space: nowrap;">{{d.btn}}</button>
</div>
</sc-for>
</div>
<span style="font-family: 'Noto Sans SC', sans-serif; font-size: 12px; line-height: 1.7; color: #7d7f82;">{{tx.resNote}}</span>
<sc-if value="{{toast}}" hint-placeholder-val="{{ false }}">
<div class="toast" style="padding: 12px 16px; border-radius: 10px; background: #1b1d1f; border: 1px solid #ffffff18; font-family: 'Noto Sans SC', sans-serif; font-size: 13px; color: #cfcfcb;"><span class="calibration-toast-check" aria-hidden="true">✓</span> {{toast}}</div>
</sc-if>
</sc-if>

<sc-if value="{{rB}}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
<sc-for list="{{freqs}}" as="f" hint-placeholder-count="4">
<button onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="padding: 14px 16px; text-align: left; background: {{f.bg}}; border: 1px solid {{f.bd}}; border-radius: 10px; display: flex; flex-direction: column; gap: 4px; color: {{f.fg}}; font-family: inherit; cursor: pointer;">
<span style="font-family: 'Noto Sans SC', sans-serif; font-size: 16px; font-weight: 500;">{{f.label}}</span>
<span style="font-family: 'Geist Mono', 'Noto Sans SC', monospace; font-size: 11px; opacity: 0.75;">{{f.sub}}</span>
</button>
</sc-for>
</div>
<div style="padding: 14px 16px; border: 1px solid #232325; border-radius: 10px; display: flex; flex-direction: column; gap: 8px; font-family: 'Noto Sans SC', sans-serif; font-size: 13px; line-height: 1.7; color: #cfcfcb;">
<span style="font-family: 'Geist Mono', 'Noto Sans SC', monospace; font-size: 10px; letter-spacing: 0.12em; color: #7d7f82;">{{tx.summary}}</span>
<span>{{tx.sumDir}}</span>
<span>{{tx.sumScope}}</span>
<span>{{tx.sumFreq}}</span>
</div>
<sc-if value="{{toast}}" hint-placeholder-val="{{ false }}">
<div class="toast" style="padding: 12px 16px; border-radius: 10px; background: #1b1d1f; border: 1px solid #ffffff18; font-family: 'Noto Sans SC', sans-serif; font-size: 13px; color: #cfcfcb;"><span class="calibration-toast-check" aria-hidden="true">✓</span> {{toast}}</div>
</sc-if>
</sc-if>
<div style="margin-top: auto; display: flex; gap: 8px; padding-top: 16px; border-top: 1px solid #232325;">
<sc-if value="{{hasPrev}}" hint-placeholder-val="{{ true }}">
<button onClick="{{prev}}" style="height: 44px; padding: 0 18px; border-radius: 22px; background: transparent; border: 1px solid rgba(236,236,232,0.3); color: #ecece8; font-family: 'Noto Sans SC', sans-serif; font-size: 13px; cursor: pointer;">{{tx.back}}</button>
</sc-if>
<button class="calibration-primary" onClick="{{next}}" disabled="{{ctaDisabled}}" style="flex-grow: 1; height: 44px; padding: 0 20px; border-radius: 22px; background: {{ctaBg}}; border: 1px solid {{ctaBg}}; color: #161616; font-family: 'Noto Sans SC', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer;">{{cta}}</button>
</div>
</div>
</div>
</div>
</template>

<script>
/* ============================================================
  1. 极简运行时：替代原画布里的 DCLogic / 模板引擎
     - setState 合并状态并整体重渲 DOM（画布 canvas 节点保持不变，动画不中断）
============================================================ */
class DCLogic {
  constructor(props) { this.props = props || {}; }
  setState(patch) { Object.assign(this.state, patch); if (this.__render) this.__render(); }
}

/* ============================================================
  2. 灵感调频组件：画布引擎 + 交互 + 文案数据
     - build()/initTuner()/setFusion(): 星系、星球、地形等场景数据
     - drawScene()/drawOverlay()/drawLoupes()/drawMarkLoupe()/drawHud(): 每帧绘制
     - resDB(): 各领域的信号内容（标题 / 英文 / 类型 / 说明）
     - renderVals(): 右侧面板与按钮用到的全部数据
============================================================ */
class Component extends DCLogic {
constructor(props) {
super(props);
var self = this;
this.dpr = 1;
try { this.dpr = Math.min(2, window.devicePixelRatio || 1); } catch (e) {}
this.cvRef = function (el) { self.cv = el; };
this.state = { stage: 0, sel: ['生物学', '城市规划'], freq: 'daily', got: {}, toast: '', primary: '核心循环', editDir: false, lang: 'en', detail: -1 };
this.hover = null;
this.build();
this.initTuner();
this.setFusion();
this.initRot();
this.bind();
}
componentDidMount() { this.start(); }
componentWillUnmount() { if (this.raf) cancelAnimationFrame(this.raf); this.raf = null; }
pal() { return { bg: '#050506', ink: [236, 236, 232], acc: [179, 222, 62], acc2: [179, 222, 62] }; }
initTuner() {
var P1 = this.P1, Pp = this.Pp, Rp = this.Rp;
var F0 = [70, 30], F1 = [P1[0] + 1.2, P1[1] + 0.4], F2 = [Pp[0] + 0.45 * Rp, Pp[1] + 0.3 * Rp], F3 = [Pp[0], Pp[1] + (-1 + 0.05) * Rp], F4 = [Pp[0], Pp[1] + 0.12 * Rp];
var POS = { '心理学': [-150, 150], '神经科学': [230, -120], '行为经济学': [-330, -210], '社会学': [120, 420], '城市规划': [650, -150], '建筑学': [-640, 260], '生态学': [-560, -330], '音乐理论': [380, 560], '人类学': [820, 250], '物理学': [-120, -760] };
var nodes = this.nodes, have = {};
nodes.forEach(function (n) { if (n.name && POS[n.name]) { n.x = POS[n.name][0]; n.y = POS[n.name][1]; n.big = true; have[n.name] = true; } else if (n.name) { n.name = ''; n.big = false; } });
Object.keys(POS).forEach(function (nm) { if (!have[nm]) nodes.push({ x: POS[nm][0], y: POS[nm][1], name: nm, big: true, teal: false }); });
nodes.forEach(function (n) { if (!n.name && Math.hypot(n.x - P1[0], n.y - P1[1]) < 90) { n.x += 140; } });
var doms = [{ name: '生物学', x: P1[0], y: P1[1] }];
this.nodes.forEach(function (n) { if (n.big && n.name) doms.push({ name: n.name, x: n.x, y: n.y }); });
doms.forEach(function (d) { var r = Math.hypot(d.x, d.y); d.hops = r < 330 ? 1 : (r < 620 ? 2 : 3); d.dist = ['', '近 · 1 跳', '中 · 2 跳', '远 · 3 跳'][d.hops]; });
doms[0].hops = 3; doms[0].dist = '远 · 3 跳';
this.domains = doms;
this.dirs = [{ name: '核心循环', cards: 9, src: '白板 ×2', star: true, r: 15, a: -0.7 }, { name: '游戏化设计', cards: 7, src: '白板 ×1', r: 23, a: 1.9 }, { name: '玩家动机', cards: 5, src: '卡片', r: 30, a: 3.5 }, { name: 'Death Stranding', cards: 4, src: '白板 ×1', r: 37, a: 5.3 }];
}
setFusion(sel) {
sel = sel || this.state.sel;
var doms = this.domains, sx = 0, sy = 0, n = 1;
sel.forEach(function (nm) { var d = doms.filter(function (q) { return q.name === nm; })[0]; if (d) { sx += d.x; sy += d.y; n++; } });
var px = sx / n, py = sy / n;
for (var it = 0; it < 3; it++) doms.forEach(function (d) { var dd = Math.hypot(px - d.x, py - d.y); if (dd < 80) { var k = (80 - dd) / Math.max(1, dd); px += (px - d.x) * k; py += (py - d.y) * k; } });
if (Math.hypot(px, py) < 110) { var a0 = Math.atan2(py, px) || 0.6; px = Math.cos(a0) * 110; py = Math.sin(a0) * 110; }
this.Pp = [px, py];
var Rp = this.Rp, L2 = 8.8, F0 = [70, 30], F3 = [px, py - 0.95 * Rp], F4 = [px, py - 625 / Math.exp(L2)];
this.UK = [{ w: 0, l: -0.85, F: F0 }, { w: 1, l: L2, F: F4 }, { w: 2, l: 10.9, F: F3 }];
this._loupeKey = null;
}
initRot() {
this.polar = this.stars.map(function (arr) { var p = new Float32Array(arr.length); for (var i = 0; i < arr.length; i += 2) { p[i] = Math.hypot(arr[i], arr[i + 1]); p[i + 1] = Math.atan2(arr[i + 1], arr[i]); } return p; });
var hh = this.hair, hp = new Float32Array(hh.length);
for (var j = 0; j < hh.length; j += 2) { hp[j] = Math.hypot(hh[j], hh[j + 1]); hp[j + 1] = Math.atan2(hh[j + 1], hh[j]); }
this.hairPolar = hp; this.rotT = 0; this.lastT = null;
}
applyRot(T) {
var P = this.polar, St = this.stars;
for (var b = 0; b < P.length; b++) {
var p = P[b], a = St[b];
for (var i = 0; i < p.length; i += 2) { var r = p[i], w = 0.003 + 0.009 * Math.sqrt(80 / (r + 80)), an = p[i + 1] - w * T; a[i] = r * Math.cos(an); a[i + 1] = r * Math.sin(an); }
}
var hp = this.hairPolar, h = this.hair;
for (var j = 0; j < hp.length; j += 2) { var an2 = hp[j + 1] - 0.004 * T; h[j] = hp[j] * Math.cos(an2); h[j + 1] = hp[j] * Math.sin(an2); }
}
freqDef(id) {
